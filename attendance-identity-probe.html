<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance identity diagnostic</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:20px;color:#20334a;background:#f5f7fa}button,input{font:inherit;padding:12px;margin:8px 0}button{background:#234d83;color:white;border:0;border-radius:6px}button:disabled{opacity:.45}input{width:90%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:16px}aside{background:#fff1cc;padding:16px}</style>
<h1>Attendance identity diagnostic</h1><aside>Synthetic records only. This does not activate attendance alerts or change business records.</aside><p>Use only the operator's current run ID and expiry. Every write is a separate action. Do not retry an uncertain write.</p><label>Run ID <input id="run" autocomplete="off"></label><label>Capture expiry (UTC) <input id="expiry" placeholder="2026-10-25T00:00:00Z" autocomplete="off"></label><div><button id="check">Check owner session</button><button id="create" disabled>Create synthetic record (step 1)</button><button id="update" disabled>Update synthetic record (step 2)</button></div><p id="status" role="status">Owner verification has not run.</p><pre id="receipt">No write attempted.</pre>
<script type="module">
import {ownerScoreSession} from './owner-score-session.js?v=20261015-persist1';
import {getIdToken,reload} from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js';
if(location.origin!=='https://atozpackersmovers.in')throw Error('Use the approved website origin');
const session=await ownerScoreSession(),$=id=>document.getElementById(id),UID='88IIhxscilQqcT0XsHqRpE0JC0V2',BASE='https://firestore.googleapis.com/v1/projects/az-packers-quotation/databases/(default)/documents',uuid=/^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$/;
let verifiedAt=0,source=null,busy=false,attempted=new Set(),ownerUser=null;
function controls(){const valid=Date.now()-verifiedAt<300000&&uuid.test($('run').value.trim())&&Date.parse($('expiry').value)>Date.now()+30000;$('check').disabled=busy;$('create').disabled=busy||!valid||attempted.has(1);$('update').disabled=busy||!valid||!source||attempted.has(2);$('run').disabled=busy||attempted.size>0;$('expiry').disabled=busy||attempted.size>0;}
async function token(){const u=session.view.currentUser;if(!u||u.uid!==UID||!u.emailVerified||u.isAnonymous||!u.providerData.some(p=>p.providerId==='password'))throw Error('Verified owner session required');await reload(u);if(session.view.currentUser!==u||!u.emailVerified)throw Error('Owner session changed');const t=await getIdToken(u,true);if(ownerUser&&ownerUser!==u)throw Error('Owner session changed');return t;}
async function call(url,body){const t=await token();const r=await fetch(url,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+t,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store',credentials:'omit',redirect:'error',signal:AbortSignal.timeout(12000)});const b=await r.json();if(!r.ok)throw Error('Request HTTP '+r.status);return b;}
$('check').onclick=async()=>{if(busy)return;busy=true;controls();try{const ready=await call('https://faultownergateway-onqwi7to4a-el.a.run.app/api/staff-score/owner-session');if(ready.ownerVerified!==true)throw Error('Owner backend verification failed');ownerUser=session.view.currentUser;verifiedAt=Date.now();$('status').textContent='Owner backend verification passed - '+new Date(verifiedAt).toISOString();}catch(e){verifiedAt=0;$('status').textContent=e.message;}finally{busy=false;controls();}};
async function write(step){if(busy||attempted.has(step))return;const run=$('run').value.trim(),expiry=Date.parse($('expiry').value);if(!uuid.test(run)||Date.now()-verifiedAt>=300000||expiry<=Date.now()+30000||expiry>Date.now()+600000||step===2&&!source)return;busy=true;attempted.add(step);controls();const name='projects/az-packers-quotation/databases/(default)/documents/azpAttendanceIdentityProbe/'+run;try{const value={update:{name,fields:step===1?{probe:{booleanValue:true},runId:{stringValue:run},step:{integerValue:'1'}}:{step:{integerValue:'2'}}},currentDocument:step===1?{exists:false}:{updateTime:source.updateTime},...(step===2?{updateMask:{fieldPaths:['step']}}:{})};const receipt=await call(BASE+':commit',{writes:[value]});source=await call(BASE+'/azpAttendanceIdentityProbe/'+run);if(source.name!==name||source.fields?.step?.integerValue!==String(step))throw Error('Readback mismatch');$('receipt').textContent=JSON.stringify({runId:run,step,commitTime:receipt.commitTime,writeResults:receipt.writeResults,createTime:source.createTime,updateTime:source.updateTime},null,2);$('status').textContent='Synthetic step '+step+' committed and read back. Wait for operator event verification.';}catch(e){$('status').textContent='Step '+step+' outcome uncertain. Do not retry. Operator must reconcile. '+e.message;$('receipt').textContent=JSON.stringify({runId:run,step,outcome:'uncertain'});}finally{busy=false;controls();}}

</script></html>
