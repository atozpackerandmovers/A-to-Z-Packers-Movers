<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>A TO Z — Verify owner email</title>
<style>:root{font-family:system-ui,sans-serif;color:#172331;background:#eef3f7}*{box-sizing:border-box}body{margin:0;padding:48px 20px}main{max-width:480px;margin:auto;background:white;border:1px solid #d6e0e8;border-radius:20px;padding:32px;box-shadow:0 12px 35px #18324b0d}.brand{font-size:12px;letter-spacing:.12em;font-weight:800;color:#236099}h1{font-size:28px;line-height:1.2;margin:16px 0}p{line-height:1.55;color:#526272}label{display:block;font-weight:600;margin:20px 0 8px}input,button{font:inherit;width:100%;border-radius:9px;padding:12px}input{border:1px solid #b6c6d5}button{cursor:pointer;border:1px solid #195b94;background:#195b94;color:white;font-weight:650;margin-top:14px}button.secondary{background:white;color:#195b94}button:disabled{opacity:.55;cursor:wait}[hidden]{display:none!important}#status{background:#f1f6fa;border-radius:9px;padding:12px;min-height:48px;font-size:14px}small{display:block;color:#607283;margin-top:20px;line-height:1.5}:focus-visible{outline:3px solid #f2bd53;outline-offset:3px}</style></head>
<body><main><div class="brand">A TO Z PACKERS &amp; MOVERS</div><h1>Verify owner email</h1><p>Sign in to the existing owner account. An email is sent only when you choose Send verification email.</p>
<form id="login"><label for="email">Owner email</label><input id="email" type="email" autocomplete="username" required value="admin@atozpackers.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="signIn">Sign in</button></form>
<section id="verification" hidden><button id="send" type="button">Send verification email</button><button id="refresh" type="button" class="secondary">I verified — check again</button><button id="signOut" type="button" class="secondary">Sign out</button></section>
<p id="status" role="status" aria-live="polite">Sign in to continue.</p><small>This page verifies your email only. After verification, return to your owner dashboard.</small></main>
<script src="owner-email-verification.js"></script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js';
import {getAuth,setPersistence,inMemoryPersistence,signInWithEmailAndPassword,signOut,sendEmailVerification,reload,getIdToken} from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js';
// Reuse the existing public web config from the pinned live driver source. No new credential.
const firebaseConfig={apiKey:'AIzaSyC4I13JSUkhun5DgpgLlnyiimTzdPobT14',authDomain:'az-packers-quotation.firebaseapp.com',databaseURL:'https://az-packers-quotation-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'az-packers-quotation',storageBucket:'az-packers-quotation.firebasestorage.app',messagingSenderId:'682004383688',appId:'1:682004383688:web:b795a19579dba9a612a2fd'};
// Named app plus memory-only persistence isolates this page from driver/GPS sign-in state.
const auth=getAuth(initializeApp(firebaseConfig,'owner-email-verification'));
const el=id=>document.getElementById(id);let controller,busy=false,verified=false;
function status(text){el('status').textContent=text;}
function controls(){const wait=controller?.remaining()||0;el('send').disabled=busy||verified||wait>0;el('send').textContent=verified?'Email verified':wait?'Resend in '+wait+'s':'Send verification email';el('refresh').disabled=busy;el('signIn').disabled=busy;el('signOut').disabled=busy;}
function errorMessage(error){return {'auth/invalid-credential':'Sign-in failed. Check the owner email and password.','auth/too-many-requests':'Too many requests. Wait before trying again.','auth/network-request-failed':'Connection failed. Check your connection and retry.','owner/account-mismatch':'Use the configured owner account.','owner/account-changed':'Account changed. Sign in again.','owner/throttled':'Wait for the resend timer before trying again.'}[error.code]||'Request failed. Please retry. No dashboard access was granted.';}
async function action(fn){if(busy||!controller)return;busy=true;controls();try{await fn();}catch(e){status(errorMessage(e));}finally{busy=false;controls();}}
try{
 await setPersistence(auth,inMemoryPersistence);
 controller=AZPOwnerEmailVerification.createOwnerVerification({auth,projectId:'az-packers-quotation',ownerUid:'88IIhxscilQqcT0XsHqRpE0JC0V2',ownerEmail:'admin@atozpackers.com',signIn:signInWithEmailAndPassword,signOut,sendEmailVerification,reload,getIdToken,storage:sessionStorage});
 el('login').addEventListener('submit',event=>{event.preventDefault();action(async()=>{try{const state=await controller.login(el('email').value.trim(),el('password').value);verified=!state.verificationRequired;el('login').hidden=true;el('verification').hidden=false;status(verified?'Email is verified. You can return to your owner dashboard.':'Choose Send verification email, open the link in your inbox, then check again.');}finally{el('password').value='';}});});
 el('send').addEventListener('click',()=>action(async()=>{const result=await controller.send();status(result.sent?'Verification email sent. Check your inbox and spam folder, then return here.':'Email is already verified. Choose check again.');}));
 el('refresh').addEventListener('click',()=>action(async()=>{verified=(await controller.refresh()).emailVerified;status(verified?'Email is verified. You can return to your owner dashboard.':'Email is still unverified. Open the email link, then check again.');}));
 el('signOut').addEventListener('click',()=>action(async()=>{controller.reset();await signOut(auth);verified=false;el('verification').hidden=true;el('login').hidden=false;status('Signed out.');}));
 setInterval(controls,1000);controls();
}catch(e){el('signIn').disabled=true;status('Secure sign-in could not start. Reload this page and retry.');}
</script></body></html>
