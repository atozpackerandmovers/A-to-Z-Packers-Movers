<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner attendance pilot check</title>
<style>body{font:16px system-ui;max-width:960px;margin:24px auto;padding:0 16px;color:#17213a}button,a{margin:6px;padding:10px}section{padding:12px;margin:12px 0;border:1px solid #bcc7db;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}strong{font-weight:800}.warning{background:#fff4dc;padding:14px}button:disabled{opacity:.5}</style></head>
<body><h1>Owner attendance pilot check</h1><p class="warning">Read-only acceptance viewer. Email/chat alerts are held. Owner corrections still receive warnings. Pilot coverage may be incomplete. This page cannot edit records, approve corrections or send alerts.</p>
<p><a href="owner-score.html" target="_blank" rel="noopener">Owner sign-in</a></p><p id="status" role="status">Checking existing browser session.</p>
<button id="owner" disabled>Check owner session</button><button id="read" disabled>Read next audit page</button><p id="summary"></p><main id="events"></main>
<script type="module">
import {ownerScoreSession} from './owner-score-session.js?v=20261015-persist1';
import {getIdToken,reload} from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js';
const BASE='https://faultownergateway-onqwi7to4a-el.a.run.app',UID='88IIhxscilQqcT0XsHqRpE0JC0V2';
const el=id=>document.getElementById(id);let session,busy=false,cursor='v1.0',count=0,generation=0,lastUser=null,mode=null;
function eligible(u){return u?.uid===UID&&u.email?.toLowerCase()==='manojgatibbi506@gmail.com'&&u.emailVerified===true&&u.isAnonymous===false&&u.providerData?.some(p=>p.providerId==='password');}
function clear(){generation++;cursor='v1.0';count=0;mode=null;el('events').replaceChildren();el('summary').textContent='';}
function sync(){const u=session?.view.currentUser;if(u!==lastUser){clear();lastUser=u;}const ready=eligible(u);for(const id of ['owner','read'])el(id).disabled=busy||!ready;if(!ready)el('status').textContent='Verified owner session unavailable. Use Owner sign-in in this same browser.';else if(!busy)el('status').textContent='Existing owner browser session available. No request has been sent automatically.';}
async function request(path){const u=session.view.currentUser,g=generation;if(!eligible(u))throw Error('owner');await reload(u);if(g!==generation||u!==session.view.currentUser||!eligible(u))throw Error('owner');const token=await getIdToken(u,true);const r=await fetch(BASE+path,{headers:{Authorization:'Bearer '+token},credentials:'omit',cache:'no-store',redirect:'error',signal:AbortSignal.timeout(15000)});const body=await r.json();if(g!==generation||u!==session.view.currentUser)throw Error('owner');if(!r.ok)throw Error('HTTP '+r.status);return body;}
async function action(fn){if(busy)return;busy=true;sync();try{await fn();}catch(e){clear();el('status').textContent=/^HTTP (401|403)$/.test(e.message)?'Owner authentication rejected; no data retained.':/^HTTP \d+$/.test(e.message)?e.message+' — attendance route unavailable or disabled.':'Request failed or response rejected. No records were changed.';}finally{busy=false;for(const id of ['owner','read'])el(id).disabled=!eligible(session?.view.currentUser);}}
el('owner').onclick=()=>action(async()=>{const r=await request('/api/staff-score/owner-session');if(r.ownerVerified!==true)throw Error('owner');el('status').textContent='Owner backend verification passed — '+new Date().toISOString();});
el('read').onclick=()=>action(async()=>{
 const r=await request('/api/attendance-changes?after='+encodeURIComponent(cursor));if(r.feedVersion!==1||!['staging','production'].includes(r.captureMode)||!Array.isArray(r.events)||r.events.length>200||typeof r.hasMore!=='boolean'||!/^v1\.(0|[1-9][0-9]{0,15})$/.test(r.cursor))throw Error('schema');
 if(mode&&mode!==r.captureMode)throw Error('mode');let seq=Number(cursor.slice(3));const nodes=[];
 for(const event of r.events){if(event.captureMode!==r.captureMode||event.feedSequence!==seq+1||!Number.isFinite(event.originalCreatedMs)||!Number.isFinite(event.changedMs)||!Array.isArray(event.changes)||(r.captureMode==='staging'&&!['probe-absent','probe-advance'].includes(event.recordId)))throw Error('schema');seq++;
  const node=document.createElement('section'),title=document.createElement('strong'),detail=document.createElement('pre');title.textContent=event.classification==='authorized_admin_correction'?'Authorized admin correction':'CHANGED AFTER 2 HOURS';detail.textContent=JSON.stringify({id:event.id,sequence:event.feedSequence,recordId:event.recordId,kind:event.kind,originalCreation:new Date(event.originalCreatedMs).toISOString(),changeTime:new Date(event.changedMs).toISOString(),actor:event.actor,oldValues:event.oldValues,newValues:event.newValues,changes:event.changes,notificationPolicy:event.notificationPolicy||'pending',pilotId:event.pilotId||null},null,2);node.append(title,detail);nodes.push(node);
 }
 if(Number(r.cursor.slice(3))!==seq||(r.hasMore&&r.events.length===0))throw Error('cursor');mode=r.captureMode;cursor=r.cursor;count+=nodes.length;el('events').append(...nodes);el('summary').textContent=JSON.stringify({captureMode:mode,loadedEvents:count,cursor,hasMore:r.hasMore,pilot:r.pilot||null});el('status').textContent='Authenticated audit page verified — '+new Date().toISOString()+'. This is capture evidence, not notification delivery.';
});
try{if(location.origin!=='https://atozpackersmovers.in')throw Error('origin');session=await ownerScoreSession();session.subscribe(sync);sync();}catch{el('status').textContent='Owner session unavailable on this origin. No records were changed.';}
window.addEventListener('pagehide',()=>{clear();session?.dispose();});
</script></body></html>
