<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repair Bill — A TO Z</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#152237;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:18px}section{background:white;border:1px solid #dde4ee;border-radius:18px;padding:20px;margin-bottom:16px}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px}.muted{color:#52647a;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}label{display:block;font-weight:650;font-size:14px}input,select,textarea{width:100%;padding:12px;border:1px solid #bac7d8;border-radius:10px;margin-top:6px;font:inherit}input[type=checkbox]{width:auto}textarea{min-height:95px}button,.capture{display:inline-block;background:#145fd1;color:white;border:0;border-radius:12px;padding:13px 16px;font:600 15px system-ui;cursor:pointer;margin:5px 5px 5px 0}.secondary{background:#e7edf6;color:#213e61}button:disabled{opacity:.5;cursor:wait}.error{color:#b42318;margin:4px 0;font-size:13px}.notice{white-space:pre-line;background:#fff7e8;padding:12px;border-radius:10px;margin:12px 0;line-height:1.5}#preview{max-width:100%;max-height:320px;object-fit:contain;display:block;margin:10px auto}#saveStatus{white-space:pre-line;font-weight:650}article{padding:12px 0;border-top:1px solid #dbe3ed}[aria-invalid=true]{border:2px solid #b42318}details pre{white-space:pre-wrap;max-height:220px;overflow:auto}fieldset{border:0;padding:0;margin:0}@media(max-width:540px){main{padding:8px}.grid{grid-template-columns:1fr}section{padding:15px}}
</style></head><body><main>
<section><h1>Repair Bill / मरम्मत का बिल</h1><p id="connection" class="muted">Connecting to your Driver login…</p><p>बिल की फोटो लें या नीचे details manually भरें। * fields ज़रूरी हैं।</p>
<fieldset id="repairControls" disabled><button type="button" id="capture">📷 Capture Bill</button><button type="button" id="choose" class="secondary">Upload Bill Photo</button><button type="button" id="manual" class="secondary">✍️ Manual Entry</button>
<input hidden id="camera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><input hidden id="gallery" type="file" accept="image/jpeg,image/png,image/webp">
<img id="preview" hidden alt="Selected garage bill"><button id="removePhoto" hidden type="button" class="secondary">Remove Photo</button>
<div class="grid"><label>Bill language<select id="language"><option value="eng">English / Numbers</option><option value="eng+hin">Hindi + English</option><option value="eng+ori">Odia + English</option></select></label><div><button id="scan" type="button" disabled>Scan Bill</button></div></div><div id="scanStatus" class="notice" role="status">फोटो से मिली जानकारी जाँचें। धुंधली/हाथ से लिखी जानकारी को manually भरना पड़ सकता है।</div><details><summary>Scanned text</summary><pre id="ocrText"></pre></details>
<form id="repairForm" novalidate><div id="fields" class="grid"></div><div id="errors" class="notice" role="alert" hidden></div><label style="margin:16px 0"><input id="confirmed" type="checkbox"> मैंने bill, amount और सभी details जाँच ली हैं। *</label><button id="save" type="submit">Submit to Execution</button><button id="clear" type="button" class="secondary">Clear Draft</button><p id="saveStatus" role="status"></p></form></fieldset></section>
<section><h2>Saved Repair Entries</h2><div id="history"></div></section>
</main><script src="repair-entry.js?v=20260928-1"></script><script src="driver-repair-form.js?v=20260928-1"></script></body></html>
